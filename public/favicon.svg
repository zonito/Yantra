<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Yantra · Kubera Wheel: 8-spoke wheel (option-wheel pipeline) + bindu, amber on near-black -->
  <rect width="64" height="64" rx="14" fill="#09090d"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#27272a" stroke-width="2"/>
  <!-- outer + inner rings -->
  <circle cx="32" cy="32" r="19" fill="none" stroke="#fcd34d" stroke-width="3"/>
  <circle cx="32" cy="32" r="11.5" fill="none" stroke="#fcd34d" stroke-width="1.6" opacity="0.75"/>
  <!-- 8 spokes: option-wheel stages radiating from the bindu -->
  <g stroke="#fcd34d" stroke-width="2.2" stroke-linecap="round">
    <line x1="37" y1="32" x2="49" y2="32"/>
    <line x1="35.54" y1="35.54" x2="43.73" y2="43.73"/>
    <line x1="32" y1="37" x2="32" y2="49"/>
    <line x1="28.46" y1="35.54" x2="20.27" y2="43.73"/>
    <line x1="27" y1="32" x2="15" y2="32"/>
    <line x1="28.46" y1="28.46" x2="20.27" y2="20.27"/>
    <line x1="32" y1="27" x2="32" y2="15"/>
    <line x1="35.54" y1="28.46" x2="43.73" y2="20.27"/>
  </g>
  <!-- bindu: the human-review gate at the centre -->
  <circle cx="32" cy="32" r="3.6" fill="#fcd34d"/>
</svg>
