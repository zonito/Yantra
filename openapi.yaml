  /stage/{id}:
    get:
      tags:
        - Stages
      operationId: getStage
      summary: Pipeline-stage page
      description: >-
        Serves the SPA shell; the client renders the stage page for the given
        pipeline node. A known `id` renders that node; an unknown `id` still
        returns HTTP 200 and the client redirects to `/`.
      parameters:
        - name: id
          in: path
          required: true
          description: Pipeline node id (observer node `jev` included).
          schema:
            type: string
            enum:
              - ecosystem
              - sutradhara
              - backfill
              - agni
              - scoop
              - dimmer
              - recommend
              - jev
              - finalize
              - execute
              - hedge
              - outcomes
              - ledger
            example: recommend
      responses:
        '200':
          description: SPA shell HTML (unknown ids redirect client-side to `/`).
          content:
            text/html:
              schema:
                type: string
                example: '<!doctype html><html lang="en"><div id="root"></div></html>'
