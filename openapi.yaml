openapi: 3.0.3
info:
  title: Yantra API
  version: 0.1.0
  description: |
    Yantra — the living, interactive Kubera Wheel Pipeline Architecture.
    This app has **no backend**: it is a static single-page application
    (React + react-router, served by Vite on port 3014). Every path below is
    served as `GET` returning the SPA shell (`index.html`, `text/html`,
    HTTP 200); client-side routing then renders the page. There are no
    POST/PUT/DELETE/PATCH endpoints, no query parameters, no request bodies,
    and no authentication on anything this app serves.

    Serving behaviour, verified against the code (`src/App.tsx`) and the live
    instance:

    * `GET /` renders the Flow home page.
    * Each client route below returns HTTP 200 with the same shell; the page
      is chosen client-side.
    * `GET /stage/{id}` renders the pipeline-stage page for a known node id
      (see the `id` enum). An unknown `id` still returns HTTP 200 — the
      client redirects to `/` (`<Navigate to="/" replace />`).
    * The router's catch-all (`path="*"`) renders Home, so **any otherwise
      unknown path returns HTTP 200** with the shell instead of a 404.
      This catch-all is intentional server behaviour, not an expressible
      OpenAPI path, so it is documented here rather than as a path item.
    * `GET /favicon.svg` serves the static icon (`image/svg+xml`, HTTP 200).

    Deliberately excluded from this contract (not part of the app's API):

    * Vite dev-only endpoints (`/@vite/client`, `/@react-refresh`,
      `/src/*` module URLs, HMR websocket) — present only under `vite dev`,
      never in preview/production builds.
    * `/assets/*` hashed production bundles — present only in `dist/` after
      `npm run build`, with content-hashed filenames that cannot be pinned
      in a stable contract.

    The sibling-service endpoints named inside page content (Kubera
    `/api/v1/wheel/...`, Varuna `/v1/varuna/...`, Drona, Vidhura, Kamadhenu,
    Rashi, Bhisma reads) are served by those apps, not by Yantra, and are
    therefore out of scope here.
  contact:
    name: zonito/yantra
  license:
    name: Private — all rights reserved
servers:
  - url: http://100.125.239.56:3014
    description: Live instance (tailnet) — Vite on port 3014
  - url: http://localhost:3014
    description: Local dev / preview — `npm run dev` or `npm run preview`
tags:
  - name: Flow
    description: Core pipeline walkthrough pages (header nav).
  - name: Stages
    description: Per-node pipeline-stage deep dives (`/stage/:id`).
  - name: Engines
    description: Engine deep-dive pages (Agni, Airavata, Kubera, Varuna, Drona, Vidhura).
  - name: Satellites
    description: Satellite briefing pages (Kamadhenu, Rashi, Bhisma).
  - name: Static
    description: Static assets served verbatim from `public/`.
paths:
  /:
    get:
      tags:
        - Flow
      operationId: getHome
      summary: Flow home page
      description: Serves the SPA shell; the client renders the pipeline flow overview.
      responses:
        '200':
          description: SPA shell HTML.
          content:
            text/html:
              schema:
                type: string
                example: '<!doctype html><html lang="en"><div id="root"></div></html>'
